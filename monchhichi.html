<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몬치치 만들기">
<meta name="theme-color" content="#ffe9d6">
<title>몬치치 만들기</title>
<style>
  html,body{margin:0;height:100%;background:#f3d9c4;overflow:hidden;touch-action:none;overscroll-behavior:none;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center;height:100dvh;
    background:radial-gradient(circle at 50% 20%,#fff1e2 0%,#f6d8c2 55%,#e9bfa6 100%)}
  canvas{display:block;cursor:pointer}
  @media(min-width:620px){canvas{border-radius:18px;box-shadow:0 18px 50px rgba(120,70,40,.35)}}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(80,40,20,.5);z-index:5}
  #ov.on{display:flex}
  #card{width:min(90vw,350px);max-height:90dvh;box-sizing:border-box;display:flex;flex-direction:column;background:#fffaf3;
    border:4px solid #e9b796;border-radius:26px;padding:16px 16px 14px;color:#8a4a2c;text-align:center;box-shadow:0 16px 40px rgba(80,40,20,.35)}
  #card h2{margin:0 0 2px;font-size:25px}
  #ovS{font-size:16px;font-weight:bold;color:#b0694a;margin-bottom:8px}
  #nameRow{display:flex;gap:6px;margin:4px 0 8px}
  #nm{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:2px solid #e9b796;border-radius:12px;background:#fff;color:#7a4526;
    -webkit-user-select:text;user-select:text;outline:none}
  #card button{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:9px 12px;cursor:pointer;color:#fff;background:#ff8fb1;touch-action:manipulation}
  #card button:active{transform:scale(.96)}
  #tabs{display:flex;gap:6px;margin-bottom:6px}
  #tabs button{flex:1;background:#f3dccb;color:#a8765a;padding:7px 4px;font-size:14px}
  #tabs button.on{background:#c98f5e;color:#fff}
  #list{list-style:none;margin:0;padding:0;overflow-y:auto;touch-action:pan-y;flex:1;min-height:90px;text-align:left}
  #list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:15px}
  #list li:nth-child(odd){background:#fdf0e4}
  #list li.me{background:#ffe0ea;outline:2px solid #ff8fb1}
  #list .rk{width:26px;text-align:center;font-weight:bold;color:#b0694a}
  #list .nmv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:bold}
  #list .st{font-size:11px;color:#c08a6c;white-space:nowrap}
  #list .sc{font-weight:bold;color:#7a4526;min-width:44px;text-align:right}
  #msg{font-size:12px;color:#c08a6c;min-height:16px;margin:6px 0}
  #btns{display:flex;gap:8px}
  #btns button{flex:1;font-size:16px;padding:11px}
  #close{background:#c9a48c !important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov"><div id="card">
  <h2 id="ovT">랭킹</h2>
  <div id="ovS"></div>
  <div id="nameRow"><input id="nm" maxlength="10" placeholder="이름 (10자까지)" autocomplete="off"><button id="nmOk">랭킹 올리기</button></div>
  <div id="tabs"><button data-t="g">전체 랭킹</button><button data-t="l">내 기록</button></div>
  <ol id="list"></ol>
  <div id="msg"></div>
  <div id="btns"><button id="again">다시 하기</button><button id="close">닫기</button></div>
</div></div>

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H)*(innerWidth>=620?0.98:1);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  SC=Math.max(1,s*dpr);
  cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,k){ // k<0 어둡게, >0 밝게
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}

const SS=2.5,SPR=[];
function buildSprite(i,img){
  const T=TIERS[i],M=IMG[i],k=T.r/M.R,w=img.naturalWidth*k,h=img.naturalHeight*k;
  const o=document.createElement('canvas');o.width=Math.ceil(w*SS);o.height=Math.ceil(h*SS);
  let c=o.getContext('2d');c.imageSmoothingQuality='high';
  // 큰 그림을 한 번에 많이 줄이면 거칠어져서 절반씩 줄임
  let src=img,sw=img.naturalWidth,sh=img.naturalHeight;
  while(sw/2>o.width){const t=document.createElement('canvas');t.width=Math.ceil(sw/2);t.height=Math.ceil(sh/2);
    const tc=t.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(src,0,0,t.width,t.height);src=t;sw=t.width;sh=t.height;}
  c.drawImage(src,0,0,o.width,o.height);
  // 그림자용 실루엣
  const P=10,s=document.createElement('canvas');s.width=Math.ceil(w)+P*2;s.height=Math.ceil(h)+P*2;
  c=s.getContext('2d');try{c.filter='blur(3px)';}catch(e){}
  c.drawImage(o,P,P,w,h);c.filter='none';c.globalCompositeOperation='source-in';c.fillStyle='#46200a';c.fillRect(0,0,s.width,s.height);
  SPR[i]={cv:o,sh:s,P,ox:-M.cx*k,oy:-M.cy*k,w,h};
}
function loadAll(){
  return Promise.all(IMG.map((m,i)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{buildSprite(i,im);ok();};im.onerror=no;im.src=m.src;})));
}
function drawBall(x,y,ti,ang,scale){
  const S=SPR[ti];if(!S)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);
  ctx.drawImage(S.cv,S.ox,S.oy,S.w,S.h);ctx.restore();
}
function drawShadow(x,y,ti,ang,scale){
  const S=SPR[ti];if(!S)return;
  ctx.save();ctx.globalAlpha=0.2;ctx.translate(x+TIERS[ti].r*0.07+3,y+TIERS[ti].r*0.1+4);ctx.rotate(ang);ctx.scale(scale,scale);

}

    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
const sDrop=()=>tone(420,180,0.12,0.15);
const sMerge=t=>{const f=330*Math.pow(1.12,t);tone(f,f*1.5,0.14,0.2,'triangle');tone(f*1.5,f*2,0.18,0.16,'sine',0.08);};
const sOver=()=>{tone(400,200,0.3,0.2,'triangle');tone(300,120,0.5,0.2,'triangle',0.25);};

/* ---------- 상태 ---------- */
let balls,parts,pops,score,best=+localStorage.getItem('mon_best')||0,cur,next,aimX,cool,over,overT,dangerT,time,maxTier,idc;
const randTier=()=>Math.floor(Math.random()*5);
function reset(){
  balls=[];parts=[];pops=[];score=0;cur=randTier();next=randTier();aimX=W/2;cool=0;over=false;overT=0;dangerT=0;time=0;maxTier=0;idc=0;
  submitted=false;myRank=0;lastTs=0;lastLocalTs=0;closeOv();
}
function mk(t,x,y){const r=TIERS[t].r;return{id:++idc,t,x,y,vx:0,vy:0,r,im:1/(r*r),ang:(Math.random()-0.5)*0.4,av:0,age:0,hit:false,born:-1};}
function clampAim(x,t){const r=TIERS[t].r;return Math.max(L+r+0.5,Math.min(R-r-0.5,x));}
function drop(){
  if(over||cool>0)return false;
  const b=mk(cur,clampAim(aimX,cur),SPAWN_Y);b.av=(Math.random()-0.5)*2;balls.push(b);
  cur=next;next=randTier();cool=0.55;sDrop();return true;
}

/* ---------- 물리 ---------- */
const G=1900,MU=0.45;
function wallHit(b,nx,ny,pen){ // n: 공 → 벽 방향
  b.x-=nx*pen;b.y-=ny*pen;b.hit=true;
  const vn=b.vx*nx+b.vy*ny;let j=0;
  if(vn>0){const e=vn>150?0.18:0;j=(1+e)*vn;b.vx-=nx*j;b.vy-=ny*j;}
  const tx=-ny,ty=nx;
  const vt=-(b.vx*tx+b.vy*ty)-b.av*b.r;
  let jt=-vt/3;const mx=MU*j+2;jt=Math.max(-mx,Math.min(mx,jt));
  b.vx-=tx*jt;b.vy-=ty*jt;b.av-=jt*2/b.r;
}
function sub(h){
  for(const b of balls){b.vy+=G*h;b.vx*=0.9992;b.av*=0.996;
    const sp=Math.hypot(b.vx,b.vy);if(sp>1600){b.vx*=1600/sp;b.vy*=1600/sp;}
    b.x+=b.vx*h;b.y+=b.vy*h;b.ang+=b.av*h;}
  for(let it=0;it<4;it++){
    const n=balls.length;
    for(let i=0;i<n;i++){
      const a=balls[i];
      for(let k=i+1;k<n;k++){
        const b=balls[k];let dx=b.x-a.x,dy=b.y-a.y;const min=a.r+b.r;
        if(Math.abs(dx)>=min||Math.abs(dy)>=min)continue;
        let d=Math.hypot(dx,dy);if(d>=min)continue;
        if(d<1e-4){dx=0.01;dy=-0.01;d=Math.hypot(dx,dy);}
        a.hit=b.hit=true;
        const nx=dx/d,ny=dy/d,tot=a.im+b.im,pen=(min-d)*0.85/tot;
        a.x-=nx*pen*a.im;a.y-=ny*pen*a.im;b.x+=nx*pen*b.im;b.y+=ny*pen*b.im;
        const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;let j=0;
        if(vn<0){const e=vn<-150?0.15:0;j=-(1+e)*vn/tot;
          a.vx-=nx*j*a.im;a.vy-=ny*j*a.im;b.vx+=nx*j*b.im;b.vy+=ny*j*b.im;}
        const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty-b.av*b.r-a.av*a.r;
        let jt=-vt/(3*tot);const mx=MU*j;jt=Math.max(-mx,Math.min(mx,jt));
        a.vx-=tx*jt*a.im;a.vy-=ty*jt*a.im;b.vx+=tx*jt*b.im;b.vy+=ty*jt*b.im;
        a.av-=jt*2*a.im/a.r;b.av-=jt*2*b.im/b.r;
      }
    }
    for(const b of balls){
      if(b.x-b.r<L)wallHit(b,-1,0,L-(b.x-b.r));
      if(b.x+b.r>R)wallHit(b,1,0,b.x+b.r-R);
      if(b.y+b.r>FLOOR)wallHit(b,0,1,b.y+b.r-FLOOR);
    }
  }
}
function merges(){
  for(let i=0;i<balls.length;i++){
    const a=balls[i];if(a.dead)continue;
    for(let k=i+1;k<balls.length;k++){
      const b=balls[k];if(b.dead||b.t!==a.t)continue;
      const d=Math.hypot(b.x-a.x,b.y-a.y);
      if(d<a.r+b.r+1.2){
        a.dead=b.dead=true;
        const x=(a.x+b.x)/2,y=(a.y+b.y)/2,t=a.t;
        score+=SCORE[t]*(t===10?3:1);
        burst(x,y,t);sMerge(t);
        if(t<10){
          const nb=mk(t+1,x,y);nb.x=Math.max(L+nb.r,Math.min(R-nb.r,x));nb.y=Math.min(FLOOR-nb.r,y);
          nb.vx=(a.vx+b.vx)/2;nb.vy=(a.vy+b.vy)/2;nb.ang=(a.ang+b.ang)/2;nb.hit=true;nb.age=1;nb.born=0;
          balls.push(nb);maxTier=Math.max(maxTier,t+1);
        }
        pops.push({x,y:y-10,txt:'+'+SCORE[t]*(t===10?3:1),life:0.9});
        break;
      }
    }
  }
  if(balls.some(b=>b.dead))balls=balls.filter(b=>!b.dead);
}
function burst(x,y,t){
  const T=TIERS[t],col=T.rim==='rainbow'?'#ffb0d8':T.rim,n=10+t*2;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*(160+t*14);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.5+Math.random()*0.4,max:0.9,size:3+Math.random()*(3+t*0.5),
      col:Math.random()<0.3?'#fff':(Math.random()<0.3?'#ffd65a':col),star:Math.random()<0.35});}
  parts.push({ring:true,x,y,r:T.r,life:0.35,max:0.35});
}
function gameOver(){over=true;overT=0;sOver();newBest=score>best;if(newBest){best=score;localStorage.setItem('mon_best',best);}onGameOver();}
function update(dt){
  time+=dt;
  if(over){overT+=dt;}
  else{
    cool=Math.max(0,cool-dt);
    const h=dt/3;for(let i=0;i<3;i++)sub(h);
    merges();
    let danger=false;
    for(const b of balls){b.age+=dt;if(b.born>=0)b.born+=dt;
      if((b.hit&&b.age>0.8)&&b.y-b.r<DANGER_Y)danger=true;}
    dangerT=danger?dangerT+dt:0;
    if(dangerT>2.2)gameOver();
  }
  for(const p of parts){p.life-=dt;if(!p.ring){p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=40*dt;}
  pops=pops.filter(p=>p.life>0);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function quad(a,b,c,d){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();}
let bgC=null;
function buildBg(){

  // 선반 바닥

  c.fillStyle=g;c.fillRect(0,752,W,H-752);
  c.fillStyle='rgba(255,255,255,.18)';c.fillRect(0,752,W,3);

  const P=(a,b,d,e)=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(d[0],d[1]);c.lineTo(e[0],e[1]);c.closePath();};

  c.fillStyle=g;P([BL,BT],[BR,BT],[BR,BB],[BL,BB]);c.fill();

  c.fillStyle=g;P([BR,BT],[FR,FT],[FR,FB],[BR,BB]);c.fill();

  c.fillStyle=g;P([BL,BB],[BR,BB],[FR,FB],[FL,FB]);c.fill();

  // 모서리 선

  [[FL,FT,BL,BT],[FR,FT,BR,BT],[FL,FB,BL,BB],[FR,FB,BR,BB]].forEach(q=>{c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(q[2],q[3]);c.stroke();});

function panel(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.82)';rr(x,y,w,h,14);ctx.fill();ctx.strokeStyle='rgba(215,150,120,.6)';ctx.lineWidth=2;ctx.stroke();}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();ctx.fill();}
function render(){
  if(!bgC||bgC.width!==cv.width||bgC.height!==cv.height)buildBg();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgC,0,0);
  ctx.setTransform(SC,0,0,SC,0,0);
  // 조준선 + 대기 중인 공
  if(!over){
    const x=clampAim(aimX,cur),r=TIERS[cur].r;
    if(cool<=0){
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2.5;ctx.setLineDash([7,9]);ctx.lineDashOffset=-time*30;
      ctx.beginPath();ctx.moveTo(x,SPAWN_Y+r+4);ctx.lineTo(x,FLOOR);ctx.stroke();ctx.setLineDash([]);
    }
  }
  // 경고선
  const near=balls.some(b=>b.hit&&b.age>0.8&&b.y-b.r<DANGER_Y+70);
  if(near||dangerT>0){
    const a=dangerT>0?0.55+0.45*Math.sin(time*14):0.45;
    ctx.strokeStyle=`rgba(240,60,80,${a})`;ctx.lineWidth=3;ctx.setLineDash([12,8]);
    ctx.beginPath();ctx.moveTo(L,DANGER_Y);ctx.lineTo(R,DANGER_Y);ctx.stroke();ctx.setLineDash([]);
  }
  // 바닥 그림자
  for(const b of balls){
    const hgt=FLOOR-(b.y+b.r),k=Math.max(0,1-hgt/260);if(k<=0)continue;
    ctx.fillStyle=`rgba(90,45,15,${0.26*k})`;ctx.beginPath();ctx.ellipse(b.x+4,FLOOR+1,b.r*(0.55+0.35*k),b.r*0.16*(0.6+0.4*k)+2,0,0,7);ctx.fill();
  }
  // 공
  for(const b of balls){
    let s=1;if(b.born>=0&&b.born<0.45)s=1+0.28*Math.exp(-9*b.born)*Math.cos(b.born*26+Math.PI);
    drawShadow(b.x,b.y,b.t,b.ang,s);
    drawBall(b.x,b.y,b.t,b.ang,s);
  }
  // 대기 공 (구름 손잡이)
  if(!over){
    const x=clampAim(aimX,cur),r=TIERS[cur].r,k=cool>0?Math.max(0,1-cool/0.25):1;
    ctx.fillStyle='rgba(255,255,255,.95)';
    [[-20,0,13],[0,-7,17],[20,0,13],[-8,5,13],[9,5,13]].forEach(([dx,dy,q])=>{circ(ctx,x+dx,SPAWN_Y-r-12+dy,q);ctx.fill();});
    if(k>0){ctx.globalAlpha=k;drawBall(x,SPAWN_Y+Math.sin(time*3)*2,cur,Math.sin(time*2)*0.08,0.6+0.4*k);ctx.globalAlpha=1;}
  }
  // 파티클
  for(const p of parts){
    const a=Math.max(0,p.life/p.max);
    if(p.ring){ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=5*a+1;circ(ctx,p.x,p.y,p.r*(1+(1-a)*0.9));ctx.stroke();continue;}
    ctx.globalAlpha=a;ctx.fillStyle=p.col;

  }

  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(FL,FT,FR-FL,FB-FT);
  ctx.save();ctx.beginPath();ctx.rect(FL,FT,FR-FL,FB-FT);ctx.clip();
  let g=ctx.createLinearGradient(FL,FT,FL+260,FT+260);
  g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(0.5,'rgba(255,255,255,0)');
  ctx.fillStyle=g;quad([FL+20,FT],[FL+95,FT],[FL-60,FT+330],[FL-135,FT+330]);ctx.fill();
  quad([FL+120,FT],[FL+140,FT],[FL-20,FT+330],[FL-40,FT+330]);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.lineJoin='round';

  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;

  // HUD

  ctx.textAlign='left';ctx.fillStyle='#b07a5c';ctx.font='bold 12px "Malgun Gothic",sans-serif';ctx.fillText('점수',28,28);
  ctx.fillStyle='#7a4526';ctx.font='bold 26px "Malgun Gothic",sans-serif';ctx.fillText(score,28,51);

  renderRank();
}
async function submitScore(){
  if(!ONLINE||submitted||sending||score<=0||!myName)return;
  sending=true;renderRank();
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:myName,score,stage:maxTier+1})});
    const j=await r.json();if(!j.ok)throw 0;
    globalTop=j.list;lastTs=j.ts;myRank=j.rank;submitted=true;netFail=false;
  }catch(e){netFail=true;}
  sending=false;renderRank();
}
function onGameOver(){saveLocal();setTimeout(()=>{if(over)openOv('over');},700);if(myName)submitScore();}
function openOv(mode){
  ovMode=mode;ovOpen=true;paused=mode==='view';
  $('nm').value=myName;$('ov').classList.add('on');
  renderRank();if(!submitted||mode==='view')fetchTop();
}
function closeOv(){ovOpen=false;paused=false;$('ov').classList.remove('on');$('nm').blur();}
function renderRank(){
  const isOver=ovMode==='over';
  $('ovT').textContent=isOver?'게임 끝!':'🏆 랭킹';
  $('ovS').style.display=isOver?'':'none';
  if(isOver)$('ovS').textContent='점수 '+score+(newBest&&score>0?'  ★ 신기록':'')+'  ·  '+TIERS[maxTier].name+'까지';
  const needName=isOver?(ONLINE&&!submitted&&score>0):true;
  $('nameRow').style.display=needName?'':'none';
  $('nmOk').textContent=isOver?(sending?'올리는 중…':'랭킹 올리기'):'이름 저장';
  $('again').textContent=isOver?'다시 하기':'새 게임';
  $('close').style.display=isOver?'none':'';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const rows=tab==='g'?(globalTop||[]):localTop,ol=$('list');ol.textContent='';
  rows.slice(0,tab==='g'?30:20).forEach((e,i)=>{
    const li=document.createElement('li');
    if(tab==='g'?(lastTs&&e.ts===lastTs):(lastLocalTs&&e.ts===lastLocalTs))li.className='me';
    const mk=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;li.appendChild(s);};
    mk('rk',['🥇','🥈','🥉'][i]||String(i+1));mk('nmv',e.name||'익명');
    mk('st',(TIERS[Math.max(1,Math.min(11,e.stage||1))-1]||TIERS[0]).name);mk('sc',String(e.score));
    ol.appendChild(li);
  });
  let m='';
  if(tab==='g'){
    if(!ONLINE)m='파일로 열면 전체 랭킹은 볼 수 없어요. 내 기록만 저장돼요.';
    else if(netFail)m='전체 랭킹에 연결하지 못했어요. 내 기록은 저장됐어요.';
    else if(!globalTop)m='불러오는 중…';
    else if(!rows.length)m='아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!';
    else if(isOver&&submitted)m='전체 '+myRank+'위로 올라갔어요!';
    else if(isOver&&score>0&&!myName)m='이름을 적고 랭킹에 올려 보세요.';
  }else if(!rows.length)m='아직 기록이 없어요.';
  $('msg').textContent=m;
  if(ol.querySelector('.me'))ol.querySelector('.me').scrollIntoView({block:'nearest'});
}
$('nmOk').addEventListener('click',()=>{
  const n=cleanName($('nm').value);if(!n){$('nm').focus();return;}
  myName=n;localStorage.setItem('mon_name',n);$('nm').value=n;$('nm').blur();
  if(ovMode==='over'){const e=localTop.find(x=>x.ts===lastLocalTs);if(e){e.name=n;try{localStorage.setItem('mon_top',JSON.stringify(localTop));}catch(_){}}submitScore();}
  else{$('msg').textContent='이름을 저장했어요.';}
});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('nmOk').click();});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;renderRank();if(tab==='g'&&!globalTop)fetchTop();}));
$('again').addEventListener('click',()=>reset());
$('close').addEventListener('click',closeOv);

/* ---------- 루프 ---------- */
const DT=1/60;let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=DT){
    if(keys.ArrowLeft||keys.a)aimX=clampAim(aimX,cur)-260*DT;
    if(keys.ArrowRight||keys.d)aimX=clampAim(aimX,cur)+260*DT;
    if(!paused)update(DT);acc-=DT;
  }
  render();requestAnimationFrame(frame);
}
reset();loadAll().then(()=>{last=performance.now();requestAnimationFrame(frame);});

/* 테스트 훅 */
window.__mon={
  state:()=>({score,best,over,cur,next,n:balls.length,maxTier,dangerT,balls:balls.map(b=>({t:b.t,x:+b.x.toFixed(1),y:+b.y.toFixed(1),v:+Math.hypot(b.vx,b.vy).toFixed(1)}))}),
  aim:x=>{aimX=x;},drop:()=>{cool=0;return drop();},setCur:t=>{cur=t;},
  end:()=>{if(!over)gameOver();},rank:()=>({ovOpen,ovMode,submitted,myName,localTop,netFail}),
  spawn:(t,x,y)=>{const b=mk(t,x,y);b.hit=true;balls.push(b);return b.id;},
  step:n=>{for(let i=0;i<n;i++)update(DT);render();},reset
};
})();
</script>
