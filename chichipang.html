<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="치치팡">
<meta name="theme-color" content="#ffe9d6">
<title>치치팡</title>
<style>
  html,body{margin:0;height:100%;background:#f3d9c4;overflow:hidden;touch-action:none;overscroll-behavior:none;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center;height:100dvh;
    background:radial-gradient(circle at 50% 20%,#fff1e2 0%,#f6d8c2 55%,#e9bfa6 100%)}
  canvas{display:block;cursor:pointer}
  @media(min-width:620px){canvas{border-radius:18px;box-shadow:0 18px 50px rgba(120,70,40,.35)}}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(80,40,20,.5);z-index:5}
  #ov.on{display:flex}
  #card{width:min(90vw,350px);max-height:90dvh;box-sizing:border-box;display:flex;flex-direction:column;background:#fffaf3;
    border:4px solid #e9b796;border-radius:26px;padding:16px 16px 14px;color:#8a4a2c;text-align:center;box-shadow:0 16px 40px rgba(80,40,20,.35)}
  #card h2{margin:0 0 2px;font-size:25px}
  #ovS{font-size:16px;font-weight:bold;color:#b0694a;margin-bottom:8px}
  #nameRow{display:flex;gap:6px;margin:4px 0 8px}
  #nm{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:2px solid #e9b796;border-radius:12px;background:#fff;color:#7a4526;
    -webkit-user-select:text;user-select:text;outline:none}
  #card button{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:9px 12px;cursor:pointer;color:#fff;background:#ff8fb1;touch-action:manipulation}
  #card button:active{transform:scale(.96)}
  #tabs{display:flex;gap:6px;margin-bottom:6px}
  #tabs button{flex:1;background:#f3dccb;color:#a8765a;padding:7px 4px;font-size:14px}
  #tabs button.on{background:#c98f5e;color:#fff}
  #list{list-style:none;margin:0;padding:0;overflow-y:auto;touch-action:pan-y;flex:1;min-height:90px;text-align:left}
  #list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:15px}
  #list li:nth-child(odd){background:#fdf0e4}
  #list li.me{background:#ffe0ea;outline:2px solid #ff8fb1}
  #list .rk{width:26px;text-align:center;font-weight:bold;color:#b0694a}
  #list .nmv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:bold}
  #list .st{font-size:11px;color:#c08a6c;white-space:nowrap}
  #list .sc{font-weight:bold;color:#7a4526;min-width:44px;text-align:right}
  #msg{font-size:12px;color:#c08a6c;min-height:16px;margin:6px 0}
  #btns{display:flex;gap:8px}
  #btns button{flex:1;font-size:16px;padding:11px}
  #close{background:#c9a48c !important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov"><div id="card">
  <h2 id="ovT">랭킹</h2>
  <div id="ovS"></div>
  <div id="nameRow"><input id="nm" maxlength="10" placeholder="이름 (10자까지)" autocomplete="off"><button id="nmOk">랭킹 올리기</button></div>
  <div id="tabs"><button data-t="g">전체 랭킹</button><button data-t="l">내 기록</button></div>
  <ol id="list"></ol>
  <div id="msg"></div>
  <div id="btns"><button id="again">다시 하기</button><button id="close">닫기</button></div>
</div></div>
<script>
(()=>{
'use strict';
const W=520,H=830;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let SC=1,tilesSC=0;
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H)*(innerWidth>=620?0.98:1);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  SC=Math.max(1,s*dpr);
  cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();

/* ---------- 판 ---------- */

 {name:'병아리 모자',bg:'#fff3b0',rim:'#f0c020'},

 {name:'토끼',       bg:'#e2d2ff',rim:'#a583ea'},
 {name:'선원',       bg:'#cfe6ff',rim:'#5d9fe8'},
 {name:'공주',       bg:'#ffd6ea',rim:'#f080b4'},
 {name:'리본',       bg:'#cdf3dc',rim:'#4cc088'},
];

function shade(hex,k){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

const faces=[];let tiles=[];
function loadAll(){
  return Promise.all(IMG.map((m,i)=>new Promise(res=>{const im=new Image();im.onload=()=>{faces[i]=im;res();};im.onerror=()=>res();im.src=m.src;})));
}
const FS=51,OUT=3.4;   // 얼굴 최대 크기, 색 테두리 두께 (칸 68 안에 여백을 남김)
function buildTiles(){
  tilesSC=SC;tiles=[];
  for(let k=0;k<=K;k++){
    const S=Math.round(CELL*SC),cn=document.createElement('canvas');cn.width=cn.height=S;
    const c=cn.getContext('2d');c.scale(S/CELL,S/CELL);
    const bomb=k===K,col=bomb?'#ffcf33':KIND[k].rim,im=faces[k];
    tiles[k]=cn;
    if(!im){c.fillStyle=col;c.beginPath();c.arc(34,34,24,0,7);c.fill();continue;}
    const s=Math.min(FS/im.width,FS/im.height),w=im.width*s,h=im.height*s,x=34-w/2,y=33-h/2;
    const sil=cl=>{const t=document.createElement('canvas');t.width=t.height=S;const q=t.getContext('2d');q.scale(S/CELL,S/CELL);
      q.imageSmoothingQuality='high';q.drawImage(im,x,y,w,h);q.globalCompositeOperation='source-in';q.fillStyle=cl;q.fillRect(0,0,CELL,CELL);return t;};
    const stamp=(t,r,dy)=>{for(let a=0;a<24;a++)c.drawImage(t,Math.cos(a*Math.PI/12)*r,Math.sin(a*Math.PI/12)*r+dy,CELL,CELL);};
    c.globalAlpha=0.16;stamp(sil('#000'),OUT+0.6,3.2);c.globalAlpha=1;   // 바닥 그림자
    stamp(sil(shade(col,-0.28)),OUT,1.6);                                // 테두리 아랫면(두께감)
    stamp(sil(col),OUT,0);                                               // 색 테두리
    stamp(sil('#fff'),1.3,0);                                            // 얇은 흰 띠
    c.imageSmoothingQuality='high';c.drawImage(im,x,y,w,h);
  }
}

let AC=null,muted=localStorage.getItem('ccp_mute')==='1';
function tone(f0,f1,dur,vol,type,delay){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}

const sBad=()=>tone(260,170,0.14,0.14,'triangle');
const sPang=n=>{const f=392*Math.pow(1.06,Math.min(n,18));tone(f,f*1.5,0.12,0.2,'triangle');tone(f*1.5,f*2,0.16,0.14,'sine',0.07);};
const sBomb=()=>{tone(180,50,0.35,0.3,'sawtooth');tone(900,300,0.25,0.15,'triangle',0.03);};
const sTick=()=>tone(880,860,0.05,0.1,'square');
const sStart=()=>{tone(523,523,0.1,0.15,'triangle');tone(784,784,0.18,0.15,'triangle',0.12);};
const sOver=()=>{tone(600,400,0.25,0.2,'triangle');tone(400,200,0.45,0.2,'triangle',0.22);};

/* ---------- 상태 ---------- */
let grid,state,phase,pt,score,best=+localStorage.getItem('ccp_best')||0,timeLeft,ending,combo,comboT,maxCombo,gauge,pendingBomb;
let sel,drag,queued,hint,idleT,sw,parts,floats,banner,shakeT,T=0,lastTick,comboPulse=0;
const randK=()=>Math.floor(Math.random()*K);
const mkP=k=>({k,bomb:false,ox:0,oy:0,vy:0,die:-1,pop:0});
const kAt=(r,c)=>(r<0||c<0||r>=N||c>=N||!grid[r][c])?-2:grid[r][c].k;
function lineAt(r,c){
  const k=kAt(r,c);if(k<0)return false;
  let a=1,i;
  for(i=c-1;kAt(r,i)===k;i--)a++;for(i=c+1;kAt(r,i)===k;i++)a++;if(a>=3)return true;
  a=1;for(i=r-1;kAt(i,c)===k;i--)a++;for(i=r+1;kAt(i,c)===k;i++)a++;return a>=3;
}
function swapG(a,b){const t=grid[a.r][a.c];grid[a.r][a.c]=grid[b.r][b.c];grid[b.r][b.c]=t;}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]&&grid[r][c].bomb)return[{r,c}];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    for(const[dr,dc]of[[0,1],[1,0]]){
      const a={r,c},b={r:r+dr,c:c+dc};if(b.r>=N||b.c>=N)continue;
      if(kAt(r,c)===kAt(b.r,b.c))continue;
      swapG(a,b);const ok=lineAt(a.r,a.c)||lineAt(b.r,b.c);swapG(a,b);
      if(ok)return[a,b];
    }
  }
  return null;
}
function findMatches(){
  const mark=[];for(let r=0;r<N;r++)mark.push(new Array(N).fill(false));
  for(let r=0;r<N;r++)for(let c=0;c<N;){
    const k=kAt(r,c);let e=c+1;while(e<N&&k>=0&&kAt(r,e)===k)e++;
    if(k>=0&&e-c>=3)for(let i=c;i<e;i++)mark[r][i]=true;c=e;
  }
  for(let c=0;c<N;c++)for(let r=0;r<N;){
    const k=kAt(r,c);let e=r+1;while(e<N&&k>=0&&kAt(e,c)===k)e++;
    if(k>=0&&e-r>=3)for(let i=r;i<e;i++)mark[i][c]=true;r=e;
  }
  const groups=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!mark[r][c])continue;
    const k=kAt(r,c),cells=[],st=[[r,c]];mark[r][c]=false;
    while(st.length){
      const[y,x]=st.pop();cells.push({r:y,c:x});
      for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const yy=y+dy,xx=x+dx;
        if(yy>=0&&xx>=0&&yy<N&&xx<N&&mark[yy][xx]&&kAt(yy,xx)===k){mark[yy][xx]=false;st.push([yy,xx]);}
      }
    }
    groups.push({k,cells});
  }
  return groups;
}
function genBoard(){
  do{
    grid=[];
    for(let r=0;r<N;r++){grid.push([]);
      for(let c=0;c<N;c++){
        let k;do{k=randK();}while((c>=2&&kAt(r,c-1)===k&&kAt(r,c-2)===k)||(r>=2&&kAt(r-1,c)===k&&kAt(r-2,c)===k));
        grid[r][c]=mkP(k);
      }
    }
  }while(!findMove());
}
function shuffle(){
  const all=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)all.push(grid[r][c]);
  let tries=0;
  do{
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=all[i];all[i]=all[j];all[j]=t;}
    for(let i=0;i<all.length;i++)grid[Math.floor(i/N)][i%N]=all[i];
    if(++tries>300){genBoard();break;}
  }while(findMatches().length||!findMove());
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)grid[r][c].pop=1;
  setBanner('섞는 중!',0.9);
}
function reset(){
  closeOv();genBoard();
  state='ready';phase='idle';pt=0;score=0;timeLeft=TIME;ending=false;combo=0;comboT=0;maxCombo=0;gauge=0;pendingBomb=0;
  sel=null;drag=null;queued=null;hint=null;idleT=0;sw=null;parts=[];floats=[];banner=null;shakeT=0;lastTick=99;
  submitted=false;myRank=0;lastTs=0;lastLocalTs=0;newBest=false;
}
function start(){if(state!=='ready')return;state='play';phase='idle';pt=0;idleT=0;setBanner('시작!',0.7);sStart();}
function setBanner(text,t){banner={text,t,d:t};}
const cx=c=>BX+c*CELL+CELL/2,cy=r=>BY+r*CELL+CELL/2;
function burst(x,y,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*190;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.45+Math.random()*0.25,t:0,col,r:2.5+Math.random()*3.5});}
}
function addScore(n,x,y,big){
  const mult=1+Math.min(combo-1,25)*0.2,pts=Math.round(n*mult/10)*10;
  score+=pts;floats.push({x,y,text:'+'+pts,t:0,big});
}
function bumpCombo(){combo++;comboT=2.2;comboPulse=1;if(combo>maxCombo)maxCombo=combo;}
function startClear(groups,origin){
  for(const g of groups){
    bumpCombo();
    const n=g.cells.length;let mx=0,my=0,keep=null;
    if(n>=5){
      keep=g.cells[Math.floor(n/2)];
      if(origin)for(const o of origin){const f=g.cells.find(q=>q.r===o.r&&q.c===o.c);if(f){keep=f;break;}}
    }
    for(const q of g.cells){
      const p=grid[q.r][q.c];mx+=cx(q.c);my+=cy(q.r);
      if(q===keep){p.k=-1;p.bomb=true;p.pop=1;burst(cx(q.c),cy(q.r),'#ffd36b',14);}
      else{p.die=0;burst(cx(q.c),cy(q.r),KIND[g.k].rim,6);}
    }
    gauge+=n;
    addScore(n*10+(n>3?(n-3)*20:0),mx/n,my/n,n>=4);
  }
  sPang(combo);phase='clear';pt=0;hint=null;idleT=0;
}
function explode(r0,c0){
  const set=new Set(),q=[[r0,c0]],seen=new Set();
  while(q.length){
    const[r,c]=q.pop(),key=r*N+c;if(seen.has(key))continue;seen.add(key);
    for(let i=0;i<N;i++)for(const[y,x]of[[r,i],[i,c]]){
      const p=grid[y][x];if(!p||p.die>=0)continue;
      set.add(y*N+x);if(p.bomb&&!seen.has(y*N+x))q.push([y,x]);
    }
  }
  bumpCombo();
  for(const key of set){const r=Math.floor(key/N),c=key%N,p=grid[r][c];p.die=0;
    burst(cx(c),cy(r),p.bomb?'#ffd36b':KIND[p.k].rim,p.bomb?16:5);}
  addScore(set.size*15,cx(c0),cy(r0),true);
  sBomb();shakeT=0.3;phase='clear';pt=0;hint=null;idleT=0;sel=null;
}
function collapse(){
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){
      const p=grid[r][c];if(!p)continue;
      if(w!==r){grid[w][c]=p;grid[r][c]=null;p.oy=-(w-r)*CELL;p.vy=260;}
      w--;
    }
    const m=w+1;
    for(let r=w;r>=0;r--){const p=mkP(randK());p.oy=-m*CELL;p.vy=260;grid[r][c]=p;}
  }
  phase='fall';pt=0;
}
function settle(){
  while(pendingBomb>0){
    pendingBomb--;const cand=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c].bomb)cand.push({r,c});
    if(!cand.length)break;
    const q=cand[Math.floor(Math.random()*cand.length)],p=grid[q.r][q.c];
    p.k=-1;p.bomb=true;p.pop=1;burst(cx(q.c),cy(q.r),'#ffd36b',16);
    floats.push({x:cx(q.c),y:cy(q.r)-10,text:'킹 폭탄!',t:0,big:true});
    tone(660,1320,0.2,0.18,'triangle');
  }
  phase='idle';pt=0;idleT=0;
  if(!ending&&!findMove())shuffle();
}
function doMove(a,b){
  const pa=grid[a.r][a.c];if(!pa)return;
  if(pa.bomb){explode(a.r,a.c);return;}
  if(!b||b.r<0||b.c<0||b.r>=N||b.c>=N)return;
  const pb=grid[b.r][b.c];if(!pb)return;
  if(pb.bomb){explode(b.r,b.c);return;}
  swapG(a,b);
  sw={pa,pb,ax:(a.c-b.c)*CELL,ay:(a.r-b.r)*CELL,a,b};
  pa.ox=sw.ax;pa.oy=sw.ay;pb.ox=-sw.ax;pb.oy=-sw.ay;
  phase='swap';pt=0;sel=null;sSwap();
}
function request(a,b){
  idleT=0;hint=null;
  if(state!=='play'||ending)return;
  if(phase==='idle')doMove(a,b);else queued={a,b,t:0.45};
}
function finish(){
  state='over';if(score>best){best=score;newBest=true;localStorage.setItem('ccp_best',best);}
  setBanner('타임 오버!',99);sOver();onGameOver();
}

/* ---------- 진행 ---------- */
function update(dt){
  T+=dt;
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;}
  parts=parts.filter(p=>p.t<p.life);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<0.9);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(shakeT>0)shakeT-=dt;if(comboPulse>0)comboPulse=Math.max(0,comboPulse-dt*3);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=grid[r][c];if(p&&p.pop>0)p.pop=Math.max(0,p.pop-dt*4);}
  if(state!=='play')return;
  if(!ending){
    timeLeft-=dt;
    const s=Math.ceil(timeLeft);if(s<=5&&s>0&&s<lastTick){lastTick=s;sTick();}
    if(timeLeft<=0){timeLeft=0;ending=true;sel=null;drag=null;queued=null;hint=null;setBanner('타임 업!',0.9);}
  }
  if(queued){queued.t-=dt;if(queued.t<=0)queued=null;}
  pt+=dt;
  if(phase==='swap'||phase==='swapback'){
    const e=Math.min(1,pt/0.12),k=1-e*(2-e);
    sw.pa.ox=sw.ax*k;sw.pa.oy=sw.ay*k;sw.pb.ox=-sw.ax*k;sw.pb.oy=-sw.ay*k;
    if(e>=1){
      if(phase==='swapback'){phase='idle';pt=0;idleT=0;}
      else{
        const g=findMatches();
        if(g.length)startClear(g,[sw.b,sw.a]);
        else{swapG(sw.a,sw.b);const t=sw.pa;sw.pa=sw.pb;sw.pb=t;
          sw.pa.ox=sw.ax;sw.pa.oy=sw.ay;sw.pb.ox=-sw.ax;sw.pb.oy=-sw.ay;phase='swapback';pt=0;sBad();}
      }
    }
  }else if(phase==='clear'){
    const d=Math.min(1,pt/0.2);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=grid[r][c];if(p&&p.die>=0)p.die=d;}
    if(d>=1){
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=grid[r][c];if(p&&p.die>=0)grid[r][c]=null;}
      while(gauge>=GAUGE){gauge-=GAUGE;pendingBomb++;}
      collapse();
    }
  }else if(phase==='fall'){
    let moving=false;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const p=grid[r][c];if(!p||p.oy>=0)continue;
      p.vy+=4200*dt;p.oy+=p.vy*dt;
      if(p.oy>=0){p.oy=0;p.vy=0;p.pop=0.5;}else moving=true;
    }
    if(!moving){const g=findMatches();if(g.length)startClear(g,null);else settle();}
  }else{ // idle
    if(ending){
      if(pt>=0.3){const m=findMove();if(m&&m.length===1)explode(m[0].r,m[0].c);else finish();}
    }else{
      if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
      if(queued){const q=queued;queued=null;doMove(q.a,q.b);}
      else{idleT+=dt;if(idleT>4&&!hint)hint=findMove();}
    }
  }
}

  if(stroke){ctx.lineJoin='round';ctx.lineWidth=stroke;ctx.strokeStyle='#fff';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if((r+c)%2===0){ctx.fillRect(BX+c*CELL,BY+r*CELL,CELL,CELL);}
  ctx.save();ctx.beginPath();ctx.rect(BX-5,BY-5,BW+10,BW+10);ctx.clip();
  const hideAll=paused&&state==='play';
  if(!hideAll)for(let pass=0;pass<2;pass++)for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=grid[r][c];if(!p)continue;
    const top=(sel&&sel.r===r&&sel.c===c)||p.die>=0||p.bomb||(sw&&(p===sw.pa)&&phase!=='idle');
    if((pass===1)!==!!top)continue;
    let x=cx(c)+p.ox,y=cy(r)+p.oy,s=1,al=1;
    if(p.die>=0){s=(1+p.die*0.5)*(1-p.die*p.die*0.9);al=1-p.die*p.die;}
    if(p.pop>0)s*=1+Math.sin(p.pop*Math.PI)*0.16;
    if(sel&&sel.r===r&&sel.c===c)s*=1.1+Math.sin(T*10)*0.03;
    if(hint&&hint.some(q=>q.r===r&&q.c===c)){x+=Math.sin(T*16)*2.5;s*=1.05;}
    if(p.bomb&&p.die<0){s*=1+Math.sin(T*7)*0.04;
      ctx.globalAlpha=0.5+Math.sin(T*7)*0.2;ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(x,y,CELL*0.5,0,7);ctx.fill();}

/* ---------- 입력 ---------- */
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
function cellAt(p){const c=Math.floor((p.x-BX)/CELL),r=Math.floor((p.y-BY)/CELL);return(r<0||c<0||r>=N||c>=N)?null:{r,c};}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);
  if(ovOpen)return;
  if(p.y>=18&&p.y<=58){
    const i=BTN.findIndex(bx=>p.x>=bx-2&&p.x<=bx+38);
    if(i===0){muted=!muted;localStorage.setItem('ccp_mute',muted?'1':'0');}
    if(i===1)reset();
    if(i===2)openOv('view');
    if(i>=0)return;
  }
  if(state==='ready'){start();return;}
  if(state==='over'){openOv('over');return;}
  if(ending)return;
  const q=cellAt(p);if(!q){sel=null;return;}
  drag={r:q.r,c:q.c,x:p.x,y:p.y,done:false};idleT=0;hint=null;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.done||ovOpen)return;
  const p=pos(e),dx=p.x-drag.x,dy=p.y-drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<CELL*0.32)return;
  drag.done=true;sel=null;
  const b=Math.abs(dx)>Math.abs(dy)?{r:drag.r,c:drag.c+(dx>0?1:-1)}:{r:drag.r+(dy>0?1:-1),c:drag.c};
  request({r:drag.r,c:drag.c},b);
});
cv.addEventListener('pointerup',()=>{
  if(!drag)return;
  const d=drag;drag=null;if(d.done||state!=='play'||ending)return;
  const p=grid[d.r][d.c];if(!p)return;
  if(p.bomb){sel=null;request({r:d.r,c:d.c},null);return;}
  if(sel&&Math.abs(sel.r-d.r)+Math.abs(sel.c-d.c)===1){const a=sel;sel=null;request(a,{r:d.r,c:d.c});}
  else if(sel&&sel.r===d.r&&sel.c===d.c)sel=null;
  else sel={r:d.r,c:d.c};
});
cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(ovOpen)return;
  if(e.key==='r'||e.key==='R')reset();
  if((e.key===' '||e.key==='Enter')&&state==='ready'){e.preventDefault();start();}
});

/* ---------- 랭킹 ---------- */
const API='/api/pangscores',ONLINE=location.protocol.indexOf('http')===0;
const $=id=>document.getElementById(id);
let myName=localStorage.getItem('ccp_name')||localStorage.getItem('mon_name')||'',localTop=[],globalTop=null,netFail=false,tab=ONLINE?'g':'l';
let ovOpen=false,ovMode='view',paused=false,submitted=false,sending=false,myRank=0,lastTs=0,lastLocalTs=0,newBest=false;
try{localTop=JSON.parse(localStorage.getItem('ccp_top')||'[]')||[];}catch(e){localTop=[];}
function cleanName(n){return String(n||'').replace(/[^\w가-힣ㄱ-ㅎㅏ-ㅣ ]/g,'').trim().slice(0,10);}
function saveLocal(){
  if(score<=0)return;
  lastLocalTs=Date.now();
  localTop.push({name:myName||'나',score,stage:maxCombo,ts:lastLocalTs});
  localTop.sort((a,b)=>b.score-a.score);localTop=localTop.slice(0,20);
  try{localStorage.setItem('ccp_top',JSON.stringify(localTop));}catch(e){}
}
async function fetchTop(){
  if(!ONLINE)return;
  try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;globalTop=await r.json();netFail=false;}catch(e){netFail=true;}
  renderRank();
}
async function submitScore(){
  if(!ONLINE||submitted||sending||score<=0||!myName)return;
  sending=true;renderRank();
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:myName,score,stage:maxCombo})});
    const j=await r.json();if(!j.ok)throw 0;
    globalTop=j.list;lastTs=j.ts;myRank=j.rank;submitted=true;netFail=false;
  }catch(e){netFail=true;}
  sending=false;renderRank();
}
function onGameOver(){saveLocal();setTimeout(()=>{if(state==='over')openOv('over');},1100);if(myName)submitScore();}
function openOv(mode){
  ovMode=mode;ovOpen=true;paused=mode==='view';drag=null;
  $('nm').value=myName;$('ov').classList.add('on');
  renderRank();if(!submitted||mode==='view')fetchTop();
}
function closeOv(){ovOpen=false;paused=false;$('ov').classList.remove('on');$('nm').blur();}
function renderRank(){
  const isOver=ovMode==='over';
  $('ovT').textContent=isOver?'타임 오버!':'🏆 랭킹';
  $('ovS').style.display=isOver?'':'none';
  if(isOver)$('ovS').textContent='점수 '+score+(newBest&&score>0?'  ★ 신기록':'')+'  ·  최대 '+maxCombo+'콤보';
  const needName=isOver?(ONLINE&&!submitted&&score>0):true;
  $('nameRow').style.display=needName?'':'none';
  $('nmOk').textContent=isOver?(sending?'올리는 중…':'랭킹 올리기'):'이름 저장';
  $('again').textContent=isOver?'다시 하기':'새 게임';
  $('close').style.display=isOver?'none':'';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const rows=tab==='g'?(globalTop||[]):localTop,ol=$('list');ol.textContent='';
  rows.slice(0,tab==='g'?30:20).forEach((e,i)=>{
    const li=document.createElement('li');
    if(tab==='g'?(lastTs&&e.ts===lastTs):(lastLocalTs&&e.ts===lastLocalTs))li.className='me';
    const mk=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;li.appendChild(s);};
    mk('rk',['🥇','🥈','🥉'][i]||String(i+1));mk('nmv',e.name||'익명');
    mk('st',(e.stage||0)+'콤보');mk('sc',String(e.score));
    ol.appendChild(li);
  });
  let m='';
  if(tab==='g'){
    if(!ONLINE)m='파일로 열면 전체 랭킹은 볼 수 없어요. 내 기록만 저장돼요.';
    else if(netFail)m='전체 랭킹에 연결하지 못했어요. 내 기록은 저장됐어요.';
    else if(!globalTop)m='불러오는 중…';
    else if(!rows.length)m='아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!';
    else if(isOver&&submitted)m='전체 '+myRank+'위로 올라갔어요!';
    else if(isOver&&score>0&&!myName)m='이름을 적고 랭킹에 올려 보세요.';
  }else if(!rows.length)m='아직 기록이 없어요.';
  $('msg').textContent=m;
  if(ol.querySelector('.me'))ol.querySelector('.me').scrollIntoView({block:'nearest'});
}
$('nmOk').addEventListener('click',()=>{
  const n=cleanName($('nm').value);if(!n){$('nm').focus();return;}
  myName=n;localStorage.setItem('ccp_name',n);$('nm').value=n;$('nm').blur();
  if(ovMode==='over'){const e=localTop.find(x=>x.ts===lastLocalTs);if(e){e.name=n;try{localStorage.setItem('ccp_top',JSON.stringify(localTop));}catch(_){}}submitScore();}
  else{$('msg').textContent='이름을 저장했어요.';}
});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('nmOk').click();});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;renderRank();if(tab==='g'&&!globalTop)fetchTop();}));
$('again').addEventListener('click',()=>{reset();start();});
$('close').addEventListener('click',closeOv);

/* ---------- 루프 ---------- */
const DT=1/60;let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=DT){if(!paused)update(DT);acc-=DT;}
  render();requestAnimationFrame(frame);
}
reset();loadAll().then(()=>{buildTiles();last=performance.now();requestAnimationFrame(frame);});

/* 테스트 훅 */
window.__ccp={
  state:()=>({state,phase,score,best,timeLeft:+timeLeft.toFixed(2),ending,combo,maxCombo,gauge,
    board:grid.map(row=>row.map(p=>!p?'.':p.bomb?'B':String(p.k)).join(''))}),
  start,reset,move:(r1,c1,r2,c2)=>request({r:r1,c:c1},{r:r2,c:c2}),tap:(r,c)=>request({r,c},null),
  hint:()=>findMove(),setTime:t=>{timeLeft=t;},setGauge:g=>{gauge=g;},
  setBoard:rows=>{rows.forEach((s,r)=>[...s].forEach((ch,c)=>{const p=mkP(ch==='B'?-1:+ch);p.bomb=ch==='B';grid[r][c]=p;}));},
  step:n=>{for(let i=0;i<n;i++)update(DT);render();},rank:()=>({ovOpen,ovMode,submitted,myName,localTop,netFail}),
  faces:()=>faces.map(f=>f?f.width+'x'+f.height:null)
};
})();
</script>
